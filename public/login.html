<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · SoundTag</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 30% 20%, #1a1a2e 0%, #0b0b10 60%);
      color: #f5f5f7;
    }
    .card {
      width: 100%;
      max-width: 340px;
      background: #161621;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.55);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: #2f80ff;
      box-shadow: 0 0 0 0 rgba(47,128,255,0.6);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(47,128,255,0.55); }
      70%  { box-shadow: 0 0 0 14px rgba(47,128,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(47,128,255,0); }
    }
    h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
    p.sub { margin: 4px 0 20px; font-size: 0.8rem; opacity: 0.55; }
    label { display: block; font-size: 0.75rem; opacity: 0.7; margin: 12px 0 6px; }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #0e0e16;
      color: #f5f5f7;
      font-size: 0.95rem;
    }
    input:focus { outline: none; border-color: #2f80ff; }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 999px;
      background: #2f80ff;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
    }
    button:hover { background: #3a8bff; }
    button:active { transform: scale(0.99); }
    button:disabled { opacity: 0.6; cursor: default; }
    .error {
      margin-top: 14px;
      font-size: 0.8rem;
      color: #ff6b76;
      min-height: 1em;
    }
  </style>
</head>
<body>
  <form class="card" id="form">
    <div class="logo">
      <span class="dot"></span>
      <h1>SoundTag</h1>
    </div>
    <p class="sub">Sign in to the control panel</p>

    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autofocus required />

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />

    <button id="submit" type="submit">Sign in</button>
    <div class="error" id="error"></div>
  </form>

  <script>
    const form = document.getElementById("form");
    const errorEl = document.getElementById("error");
    const submit = document.getElementById("submit");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      submit.disabled = true;
      submit.textContent = "Signing in…";
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: form.username.value,
            password: form.password.value,
          }),
        });
        if (res.ok) {
          window.location.href = "/control";
          return;
        }
        const data = await res.json().catch(() => ({}));
        errorEl.textContent = data.error || "Sign in failed";
      } catch {
        errorEl.textContent = "Network error — is the server running?";
      }
      submit.disabled = false;
      submit.textContent = "Sign in";
    });
  </script>
</body>
</html>
